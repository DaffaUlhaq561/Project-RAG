version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.daffaulhq.online
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.daffaulhq.online
      - GENERIC_TIMEZONE=Asia/Jakarta
      - N8N_USER_MANAGEMENT_DISABLED=false
      - N8N_ADMIN_EMAIL=daffaulhaq5656@gmail.com
      - N8N_ADMIN_PASSWORD=admin561
    volumes:
      - ./n8n_data:/home/node/.n8n

volumes:
  n8n_data:
